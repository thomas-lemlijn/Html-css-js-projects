<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Counter in JS</title>
</head>
<body>
    <div class="container">
        <span class="container-span">Simple counter with JS</span>

        <div class="container-counter">
            <span onclick="remove()" class="container-counter-minus">-</span>
            <span id="counter-input" class="container-counter-input">1</span>
            <span onclick="add()" class="container-counter-plus">+</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
